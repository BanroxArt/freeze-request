[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freezereq"
version = "0.1.0"
description = "Build an evidence package for a stablecoin issuer's freeze team or a law-enforcement referral: the transaction chain, off-ramp points, token contract and addresses, a stated tracing rule, and a timeline, as JSON and Markdown, with the lawful-order and issuer-policy checks spelled out. Engineering checklist, not legal advice."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Art Akopian", email = "opensource@banrox.com" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["stablecoin", "freeze", "blacklist", "genius-act", "fraud", "investigations", "usdc", "law-enforcement"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "hypothesis>=6.100"]

[project.urls]
Homepage = "https://banrox.com"
Source = "https://github.com/BanroxArt/freeze-request"

[project.scripts]
freezereq = "freezereq.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
freezereq = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
